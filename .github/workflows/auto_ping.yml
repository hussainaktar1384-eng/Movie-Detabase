name: Gofile Timer Script

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch: 

jobs:
  run-ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python ping_script.py
      
